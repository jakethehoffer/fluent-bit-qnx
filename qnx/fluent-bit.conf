# Reference agent. tools/start-agent.sh copies this to the target and
# replaces __TARGET_DIR__ with the real directory. Fluent Bit does not
# expand shell variables.

[SERVICE]
    Flush                 1
    Daemon                Off
    Log_Level             info
    HTTP_Server           Off
    Grace                 5
    storage.path          __TARGET_DIR__/storage
    storage.max_chunks_up 128

[INPUT]
    Name            slog2
    Tag             slog
    mem_buf_limit   5M
    storage.type    filesystem

[INPUT]
    Name            qnx_proc
    Tag             proc
    mem_buf_limit   5M
    storage.type    filesystem

[OUTPUT]
    Name         loki
    Match        *
    Host         10.0.2.2
    Port         3100
    labels       job=fluent-bit-qnx
    line_format  json
    retry_limit  false
    workers      1
