[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    HTTP_Server  Off
    Grace        5

# Alternation must work (extended syntax), so both helpers are reported.
[INPUT]
    Name           qnx_proc
    Tag            proc.alt
    interval_sec   1
    match          ^(memhog|spinner)$

# Matching is case sensitive, so no process is reported.
[INPUT]
    Name           qnx_proc
    Tag            proc.case
    interval_sec   1
    match          ^MEMHOG$

[OUTPUT]
    Name        http
    Match       *
    Host        10.0.2.2
    Port        9880
    URI         /ingest
    Format      json
    header_tag  X-Tag
    workers     1
