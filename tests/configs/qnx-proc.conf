[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    HTTP_Server  Off
    Grace        5

[INPUT]
    Name           qnx_proc
    Tag            proc
    interval_sec   1

[OUTPUT]
    Name        http
    Match       *
    Host        10.0.2.2
    Port        9880
    URI         /ingest
    Format      json
    header_tag  X-Tag
    workers     1
