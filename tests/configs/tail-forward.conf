[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    HTTP_Server  Off
    Grace        5

[INPUT]
    Name              tail
    Tag               tail
    Path              __TARGET_DIR__/lines.log
    Read_from_Head    On
    Refresh_Interval  1

[OUTPUT]
    Name                  forward
    Match                 *
    Host                  10.0.2.2
    Port                  24224
    send_options          on
    require_ack_response  on
    workers               1
