[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    HTTP_Server  Off
    Grace        5

[INPUT]
    Name              tail
    Tag               tail
    Path              __TARGET_DIR__/lines.log
    Read_from_Head    On
    Refresh_Interval  1

[OUTPUT]
    Name         loki
    Match        *
    Host         10.0.2.2
    Port         13100
    labels       job=fluent-bit-qnx
    line_format  json
    workers      1
