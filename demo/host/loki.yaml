# Single-process Loki. FBQ_DEMO_DATA is set by demo/host/host-up.sh.
# HTTP listens on every interface so the QNX guest can reach 10.0.2.2:3100.
auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${FBQ_DEMO_DATA}
  storage:
    filesystem:
      chunks_directory: ${FBQ_DEMO_DATA}/chunks
      rules_directory: ${FBQ_DEMO_DATA}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16

limits_config:
  allow_structured_metadata: true
  discover_log_levels: true
  volume_enabled: true
  reject_old_samples: false
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_line_size: 256kb
  max_query_series: 500
  max_entries_limit_per_query: 5000

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: ${FBQ_DEMO_DATA}/wal
    flush_on_shutdown: true

analytics:
  reporting_enabled: false

ruler:
  alertmanager_url: http://127.0.0.1:9093
